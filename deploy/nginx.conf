# Glowup: static hosting example for nginx.
# Copy the contents of dist/ to the root below. The server only delivers files.
# gzip_static is built in. brotli_static needs the ngx_brotli module; without it, remove that line.

server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    root /var/www/glowup;
    index index.html;

    # Serve the .gz and .br files made at build time. Nothing is compressed at runtime.
    gzip off;
    gzip_static on;
    brotli_static on;

    types {
        text/html html;
        text/css css;
        text/javascript js;
        application/manifest+json webmanifest;
        image/svg+xml svg;
        font/woff2 woff2;
        font/woff woff;
    }

    # nginx drops inherited add_header lines inside a location that adds its own,
    # so the shared headers live in an include, copied from deploy/glowup-headers.conf.
    location /assets/ {
        include /etc/nginx/snippets/glowup-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /sw.js {
        include /etc/nginx/snippets/glowup-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/snippets/glowup-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Single-page fallback.
    location / {
        include /etc/nginx/snippets/glowup-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
